<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEH Digital Twin - Premium Interactive Stream Controller</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.35);
            --bg-dark: #070a13;
            --panel-bg: rgba(10, 15, 30, 0.85);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-green: #10B981;
            --accent-red: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 1. Full Screen Stream Viewport */
        .viewport-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .viewport-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 2. Interactive Click Overlay Targets */
        .overlay-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; /* Let clicks pass through empty spaces */
        }

        .interactive-target {
            position: absolute;
            width: 52px;
            height: 52px;
            border-radius: 12px;
            pointer-events: auto; /* Active click areas */
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease, font-size 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0px; /* Hide text by default (empty in play mode) */
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            box-shadow: 0 0 0 0 transparent;
        }

        /* Play Mode Styles (Invisible, click-through) */
        .interactive-target.play-mode {
            background: rgba(255, 255, 255, 0.001); /* Invisible but clickable */
            border: 1px solid transparent;
        }

        .interactive-target.play-mode:hover {
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        /* Edit Mode Styles (Visible, Draggable) */
        .interactive-target.edit-mode {
            background: rgba(59, 130, 246, 0.35);
            border: 2px dashed var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
            cursor: move;
            font-size: 0.75rem; /* Show text labels in edit mode */
        }

        .interactive-target.edit-mode:hover {
            background: rgba(59, 130, 246, 0.55);
            transform: scale(1.05);
        }

        /* 3. Floating Sliding Settings Panel */
        .settings-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            pointer-events: none;
        }

        .settings-trigger {
            width: 50px;
            height: 50px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
            transition: transform 0.2s, background-color 0.2s;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            font-size: 1.4rem;
        }

        .settings-trigger:hover {
            transform: rotate(45deg) scale(1.05);
            background: rgba(20, 25, 45, 0.95);
        }

        .settings-panel {
            width: 260px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            padding: 1.25rem;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            pointer-events: auto;
            opacity: 0;
            transform: translateY(-20px) scale(0.95);
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            visibility: hidden;
        }

        /* Click flow open panel */
        .settings-container.keep-open .settings-panel {
            opacity: 1;
            transform: translateY(0) scale(1);
            visibility: visible;
        }

        /* Header Style inside settings */
        .settings-header {
            font-size: 1rem;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Interactive Switches */
        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.25);
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
        }

        .switch-label {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #374151;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Buttons styles */
        .btn-group {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #6366f1);
            border: none;
        }

        .btn-primary:hover {
            opacity: 0.95;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        /* Status Widget */
        .status-widget {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6b7280;
        }

        .status-dot.active {
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .status-dot.error {
            background: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
        }

        /* 4. Overlay edit Banner warning */
        .edit-banner {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(59, 130, 246, 0.9);
            border: 1px solid var(--primary);
            color: #fff;
            padding: 0.7rem 1.5rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 15px var(--primary-glow);
            z-index: 99;
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            gap: 0.6rem;
            pointer-events: none;
        }

        .edit-banner.visible {
            display: flex;
        }
    </style>
</head>
<body>

    <!-- Drag Position Warning Banner -->
    <div id="edit-banner" class="edit-banner">
        <span>🔧</span>
        <span>Chế độ thiết lập nút: Kéo thả các ô viền xanh vào đúng vị trí nút trong video của bạn.</span>
    </div>

    <!-- Main Viewport holding VDO.Ninja Iframe -->
    <div class="viewport-container" id="viewport">
        <!-- Overlay targets representing transparent buttons -->
        <div class="overlay-container" id="overlay-container">
            <div class="interactive-target play-mode" data-id="home" onclick="triggerCommand('home')">Home</div>
            <div class="interactive-target play-mode" data-id="temp" onclick="triggerCommand('temp')">Temp</div>
            <div class="interactive-target play-mode" data-id="hum" onclick="triggerCommand('hum')">Hum</div>
            <div class="interactive-target play-mode" data-id="co2" onclick="triggerCommand('co2')">CO2</div>
            <div class="interactive-target play-mode" data-id="tvoc" onclick="triggerCommand('tvoc')">TVOC</div>
            <div class="interactive-target play-mode" data-id="pm" onclick="triggerCommand('pm')">PM</div>
            <div class="interactive-target play-mode" data-id="zones" onclick="triggerCommand('zones')">Zones</div>
            <div class="interactive-target play-mode" data-id="weather" onclick="triggerCommand('weather')">Weather</div>
            <div class="interactive-target play-mode" data-id="web" onclick="triggerCommand('web')">Web</div>
            <div class="interactive-target play-mode" data-id="chart" onclick="triggerCommand('chart')">Chart</div>
        </div>

        <iframe id="stream-frame" src="" allow="autoplay; encrypted-media; fullscreen"></iframe>
    </div>

    <!-- Floating Settings Controls -->
    <div id="settings-container" class="settings-container">
        <div class="settings-trigger" onclick="toggleSettingsPanel()">⚙️</div>
        
        <div class="settings-panel">
            <div class="settings-header">
                <span>Cài Đặt Nút Bấm</span>
                <div id="status-dot" class="status-dot"></div>
            </div>

            <!-- Layout Drag & Drop Editor Toggle -->
            <div class="switch-container">
                <span class="switch-label">Sắp xếp vị trí nút</span>
                <label class="switch">
                    <input type="checkbox" id="edit-mode-toggle" onchange="toggleEditMode(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Action buttons -->
            <div class="btn-group">
                <button class="btn" onclick="resetPositions()">Đặt Lại</button>
                <button class="btn btn-primary" onclick="toggleSettingsPanel()">Xong</button>
            </div>

            <div class="status-widget">
                <span id="status-text" class="status-text" style="color: var(--text-muted);">Trạng thái: Sẵn sàng</span>
            </div>
        </div>
    </div>

    <script>
        // Hardcoded VDO.Ninja View ID
        const hardcodedNinjaId = '79KvXK2';

        // Default relative positions for buttons (stack vertically on left side where Unity sidebar is)
        const DEFAULT_POSITIONS = {
            home:    { x: 1.0, y: 10.0 },
            temp:    { x: 1.0, y: 18.0 },
            hum:     { x: 1.0, y: 26.0 },
            co2:     { x: 1.0, y: 34.0 },
            tvoc:    { x: 1.0, y: 42.0 },
            pm:      { x: 1.0, y: 50.0 },
            zones:   { x: 1.0, y: 58.0 },
            weather: { x: 1.0, y: 66.0 },
            web:     { x: 1.0, y: 74.0 },
            chart:   { x: 1.0, y: 82.0 }
        };

        let isEditMode = false;
        let draggedElement = null;
        let dragOffset = { x: 0, y: 0 };
        let buttonPositions = {};
        let backendUrl = '';

        // Auto-rotation variables
        let autoRotateInterval = null;
        let currentRotateIndex = 0;
        const rotateMetrics = ["home", "temp", "hum", "co2", "tvoc", "pm1", "pm25", "pm10"];
        let lastInteractionTime = Date.now();

        document.addEventListener('DOMContentLoaded', () => {
            // Dynamic resolution: if no saved URL, use the current domain.
            const defaultUrl = window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1') || window.location.origin.startsWith('file://')
                ? 'http://127.0.0.1:5000'
                : window.location.origin;

            backendUrl = localStorage.getItem('remote_backend_url') || defaultUrl;
            
            // Load button layout positions
            loadButtonPositions();

            // Set up drag-and-drop listeners
            setupDraggableButtons();

            // Always update stream source with hardcoded ID
            updateStreamSource();
            
            // Test connection
            checkBackendConnection(backendUrl);

            // Start auto-rotation
            startAutoRotation();
        });

        // Toggle settings panel open/closed
        function toggleSettingsPanel() {
            const container = document.getElementById('settings-container');
            container.classList.toggle('keep-open');
        }

        // Toggle editor edit mode
        function toggleEditMode(checked) {
            isEditMode = checked;
            const banner = document.getElementById('edit-banner');
            const targets = document.querySelectorAll('.interactive-target');
            
            if (isEditMode) {
                banner.classList.add('visible');
                document.getElementById('settings-container').classList.add('keep-open');
                targets.forEach(t => {
                    t.classList.remove('play-mode');
                    t.classList.add('edit-mode');
                });
            } else {
                banner.classList.remove('visible');
                document.getElementById('settings-container').classList.remove('keep-open');
                targets.forEach(t => {
                    t.classList.remove('edit-mode');
                    t.classList.add('play-mode');
                });
            }
        }

        // Load stream source in iframe
        function updateStreamSource() {
            const frame = document.getElementById('stream-frame');
            // Premium clean VDO.Ninja parameters: transparent bg, hide control bar, autoplay, HD 1080p, 8mbps
            frame.src = `https://vdo.ninja/?view=${hardcodedNinjaId}&autoplay=1&mute=1&clean=1&transparent=1&nomenu=1&nocontrols=1&noheader=1&hd=1&scale=100&bitrate=8000`;
        }

        // Test backend API URL
        function checkBackendConnection(url) {
            const cleanUrl = url.replace(/\/$/, "");
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');

            dot.className = 'status-dot';
            text.textContent = 'Đang kết nối...';

            fetch(`${cleanUrl}/api/command`)
                .then(res => {
                    if (res.ok) {
                        dot.className = 'status-dot active';
                        text.textContent = 'Trạng thái: Đã kết nối API';
                    } else {
                        throw new Error('Server returned error');
                    }
                })
                .catch(err => {
                    dot.className = 'status-dot error';
                    text.textContent = 'Trạng thái: Lỗi kết nối API';
                });
        }

        // Send control command to the backend
        function triggerCommand(metric) {
            if (isEditMode) return; // Prevent clicking while dragging
            
            // Reset the auto-rotation idle timer on manual interaction
            resetRotationTimer();

            // Align rotation index so rotation resumes from here
            const idx = rotateMetrics.indexOf(metric);
            if (idx !== -1) {
                currentRotateIndex = idx;
            }

            setStatus(`Đang chuyển: ${metric.toUpperCase()}...`, 'active');

            fetch(`${backendUrl}/api/command`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ metric: metric })
            })
            .then(res => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            })
            .then(data => {
                setStatus(`Đã chuyển sang ${metric.toUpperCase()}`, 'active');
            })
            .catch(err => {
                setStatus(`Lỗi: ${err.message}`, 'error');
            });
        }

        // Set status bar messages
        function setStatus(msg, className) {
            const text = document.getElementById('status-text');
            const dot = document.getElementById('status-dot');
            text.textContent = `Lịch sử: ${msg}`;
            
            if (className === 'active') {
                dot.className = 'status-dot active';
            } else if (className === 'error') {
                dot.className = 'status-dot error';
            }
        }

        // Load or initialize button coordinates
        function loadButtonPositions() {
            const saved = localStorage.getItem('remote_button_positions');
            if (saved) {
                buttonPositions = JSON.parse(saved);
            } else {
                buttonPositions = JSON.parse(JSON.stringify(DEFAULT_POSITIONS));
            }

            // Apply positions to elements
            applyLoadedPositions();
        }

        function applyLoadedPositions() {
            const targets = document.querySelectorAll('.interactive-target');
            targets.forEach(t => {
                const id = t.dataset.id;
                const pos = buttonPositions[id] || DEFAULT_POSITIONS[id];
                t.style.left = `${pos.x}%`;
                t.style.top = `${pos.y}%`;
            });
        }

        // Drag & Drop event listener setups
        function setupDraggableButtons() {
            const targets = document.querySelectorAll('.interactive-target');
            const container = document.getElementById('viewport');

            targets.forEach(t => {
                // Mouse down
                t.addEventListener('mousedown', (e) => {
                    if (!isEditMode) return;
                    draggedElement = t;
                    const rect = t.getBoundingClientRect();
                    dragOffset.x = e.clientX - rect.left;
                    dragOffset.y = e.clientY - rect.top;
                    t.style.transition = 'none';
                    e.preventDefault();
                });
            });

            // Mouse move
            document.addEventListener('mousemove', (e) => {
                if (!draggedElement || !isEditMode) return;

                const containerRect = container.getBoundingClientRect();
                let x = e.clientX - containerRect.left - dragOffset.x;
                let y = e.clientY - containerRect.top - dragOffset.y;

                // Convert to percentage of viewport
                let pctX = (x / containerRect.width) * 100;
                let pctY = (y / containerRect.height) * 100;

                // Clamp within bounds
                pctX = Math.max(0, Math.min(96, pctX));
                pctY = Math.max(0, Math.min(96, pctY));

                draggedElement.style.left = `${pctX}%`;
                draggedElement.style.top = `${pctY}%`;

                // Update local memory coordinates
                const id = draggedElement.dataset.id;
                buttonPositions[id] = { x: parseFloat(pctX.toFixed(2)), y: parseFloat(pctY.toFixed(2)) };
            });

            // Mouse up
            document.addEventListener('mouseup', () => {
                if (draggedElement) {
                    draggedElement.style.transition = '';
                    draggedElement = null;
                    // Save to local storage
                    localStorage.setItem('remote_button_positions', JSON.stringify(buttonPositions));
                }
            });
        }

        // Reset positions to default column layout
        function resetPositions() {
            if (confirm("Bạn có chắc chắn muốn đặt lại vị trí các nút bấm về mặc định?")) {
                buttonPositions = JSON.parse(JSON.stringify(DEFAULT_POSITIONS));
                localStorage.setItem('remote_button_positions', JSON.stringify(buttonPositions));
                applyLoadedPositions();
                setStatus('Đã reset vị trí nút!', 'active');
            }
        }

        // Start auto-rotation timer loop
        function startAutoRotation() {
            if (autoRotateInterval) clearInterval(autoRotateInterval);
            autoRotateInterval = setInterval(() => {
                // Do not rotate if in edit mode
                if (isEditMode) return;
                
                // Do not rotate if settings panel is open
                const container = document.getElementById('settings-container');
                if (container.classList.contains('keep-open')) return;
                
                // Do not rotate if the user interacted manually in the last 30s
                if (Date.now() - lastInteractionTime < 30000) return;
                
                // Increment and cycle
                currentRotateIndex = (currentRotateIndex + 1) % rotateMetrics.length;
                const nextMetric = rotateMetrics[currentRotateIndex];
                
                // Send rotation command
                sendAutoRotationCommand(nextMetric);
            }, 30000); // Trigger check every 30 seconds
        }

        function resetRotationTimer() {
            lastInteractionTime = Date.now();
        }

        function sendAutoRotationCommand(metric) {
            if (!backendUrl) return;
            setStatus(`Xoay vòng tự động: ${metric.toUpperCase()}...`, 'active');
            fetch(`${backendUrl}/api/command`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ metric: metric })
            })
            .catch(err => {
                // Ignore errors during auto-rotation to keep stream stable
            });
        }
    </script>
</body>
</html>
